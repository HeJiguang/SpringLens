  <text x="502" y="365" fill="#87E8FF" font-family="Consolas, Segoe UI Mono, monospace" font-size="18" font-weight="700">2</text>
  <text x="502" y="394" fill="#F4FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">draft_runtime_safety</text>
  <text x="502" y="423" fill="#F4FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">_remediation</text>

  <rect x="848" y="332" width="330" height="84" rx="22" fill="url(#card)" stroke="#365F7C" filter="url(#shadow)"/>
  <text x="876" y="365" fill="#87E8FF" font-family="Consolas, Segoe UI Mono, monospace" font-size="18" font-weight="700">3</text>
  <text x="876" y="394" fill="#F4FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">promote_runtime_safety</text>
  <text x="876" y="423" fill="#F4FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">_remediation</text>

  <path d="M432 374H462" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M806 374H836" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

