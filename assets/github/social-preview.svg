  <rect x="0" y="0" width="1280" height="640" rx="0" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="220" fill="#123B5C" fill-opacity="0.32"/>
  <circle cx="170" cy="520" r="180" fill="#0D6B73" fill-opacity="0.2"/>

  <rect x="60" y="56" width="1160" height="528" rx="28" fill="#0B1726" fill-opacity="0.72" stroke="#2E506C" stroke-opacity="0.7"/>

