  <text x="100" y="214" fill="#F4FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Runtime control plane for coding agents</text>
  <text x="100" y="268" fill="#A8C2D8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400">Turn a Spring Boot app into an agent-callable runtime system for Codex, Cursor, and CloudCode.</text>

